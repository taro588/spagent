name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Diagnose Python syntax
        shell: pwsh
        run: |
          $report = "syntax_report.txt"
          Remove-Item -Force -ErrorAction SilentlyContinue $report
          $failed = $false
          Get-ChildItem -Recurse plugin -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName 2>&1 | Tee-Object -FilePath $report -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true; Add-Content $report ("FAILED: " + $_.FullName) }
            else { Add-Content $report ("OK: " + $_.FullName) }
          }
          if ($failed) { throw "One or more Python files failed syntax compilation. See syntax_report.txt." }

      - name: Validate Python and release tests
        shell: pwsh
        run: |
          python -m pip install -q pytest
          python -m compileall -q plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 整个 tests/ 目录：发布校验 + Tool Registry 契约测试（§12 / §13 / §28）
          python -m pytest -q tests/ 2>&1 | Tee-Object -FilePath pytest_report.txt
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed. See pytest_report.txt." }

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SP-AI-Assistant-0.7.4-pytest-diagnostic
          path: pytest_report.txt
          if-no-files-found: warn

      - name: Upload syntax diagnostic
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SP-AI-Assistant-0.7.4-syntax-diagnostic
          path: syntax_report.txt
          if-no-files-found: warn

      - name: Build embedded browser host (QtWebEngine)
        shell: pwsh
        run: |
          python -m pip install -q "PySide6==6.11.2" "PySide6-Addons==6.11.2" pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed --name browser_host `
            --distpath browser_host\dist --workpath browser_host\build `
            browser_host\main.py
          if ($LASTEXITCODE -ne 0) { throw "browser_host build failed" }
          if (-not (Test-Path "browser_host\dist\browser_host\browser_host.exe")) { throw "browser_host.exe missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" installer\SP_AI_Assistant.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $expected = "installer\output\SP_AI_Assistant_Setup_0.7.4.exe"
          if (-not (Test-Path -LiteralPath $expected)) { throw "Expected installer EXE not produced: $expected" }
          $exe = Get-Item -LiteralPath $expected
          if ($exe.Length -lt 100000) { throw "Installer EXE is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Built: $($exe.FullName)"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "installer\output\SP_AI_Assistant_Setup_0.7.4.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: SP-AI-Assistant-Setup-0.7.4
          path: installer/output/*
          if-no-files-found: error
