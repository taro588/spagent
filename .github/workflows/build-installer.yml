name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m pip install -q pytest
          python -m compileall -q plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/validate_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" installer\SP_AI_Assistant.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $expected = "installer\output\SP_AI_Assistant_Setup_0.3.0.exe"
          if (-not (Test-Path -LiteralPath $expected)) { throw "Expected installer EXE not produced: $expected" }
          $exe = Get-Item -LiteralPath $expected
          if ($exe.Length -lt 100000) { throw "Installer EXE is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Built: $($exe.FullName)"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "installer\output\SP_AI_Assistant_Setup_0.3.0.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: SP-AI-Assistant-Setup-0.3.0
          path: installer/output/*
          if-no-files-found: error
